# Original rimworld-go world-map (globe) palette (NG-1 §1.2).
# One base colour per biome; hills and mountains read through the relief
# and its light, with bare rock below and snow above the snowline (plan §1.2). shallow is the
# coastal band, shore the coastline stroke, grid the optional tile edges,
# hill_* the Hilliness view mode, road_* the road classes (road_centre the
# asphalt centre line), label and label_ocean the feature names. Prototyped for this project, not sampled
# from another game. Consumed by internal/adapters/inbound/ebiten/globe.

