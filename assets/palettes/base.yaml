# rimworld-go base palette and global visual tokens (ART spec §6, §33).
version: 1
outline:
  darken: 0.18          # outline = adjacent sprite colour * darken (chromatic, not black)
  width_px_1x: 3
shadow:
  rgb: "#1a1714"
  alpha: 0.30
  offset_px_1x: [2.5, 3]  # lower-right
overlay:
  selection:   "#f2f2e6"
  designation: "#f0d43c"
  blueprint:   "#5ab4dc"
  stockpile:   "#dcc850"
  danger:      "#e0513c"
# Runtime tint presets for neutral (tint: true) materials.
tints:
  skin:  {pale: "#f0d3be", light: "#dcb08e", tan: "#bf8a62", brown: "#8f5f3f", dark: "#5e3d29"}
  hair:  {black: "#2b2522", brown: "#5a3b26", auburn: "#8a4a2c", blond: "#d6b46e", grey: "#a7a39d"}
  # Natural stone tints (SIM-029): the RGB values from the user-supplied
  # rendering reference (RimWorld Core stone colours), used at the user's
  # explicit request. Multiplies stone_neutral sprites (colour scale) and
  # stone_tint masks.
  stone_tint: {sandstone: "#7e685e", granite: "#695f61", limestone: "#9e9987", slate: "#464646", marble: "#848784"}
  cloth: {sand: "#cbb48c", olive: "#7a8150", navy: "#3f5170", rust: "#a2593a", slate: "#6b7480", cream: "#e3dccb", raider: "#4b2626"}
  # Carpet floor colours (AX-3): one per construction.CarpetColours name,
  # original values. Multiplies structure/floor_carpet (a colour scale).
  carpet: {crimson: "#9b2a2a", rosewood: "#8a4a48", rust: "#8c3f26", poppy: "#b8302a", wine: "#6a1f2b", damson: "#5e2f4a", heather: "#6b4a5a", fuchsia: "#a3326f", orchid: "#8c5a7a", violet: "#6a3a8a", lilac: "#7a6390", amethyst: "#6a5a7a", aubergine: "#45285e", mulberry: "#5a2e6e", midnight: "#33306e", periwinkle: "#5a5a9a", cobalt: "#2f4f9a", denim: "#4a6088", frost: "#8fb0c8", navy: "#24406a", cornflower: "#5f8fc8", twilight: "#4a5878", lichen: "#5a6a3a", fern: "#6f8a3a", lagoon: "#2a6e6e", clover: "#3a7a3a", eucalyptus: "#8a9a7a", celadon: "#7a9478", spruce: "#2e5233", juniper: "#2a4a3a", bog: "#4a5a38", reed: "#6a6a42", rush: "#56664a", emerald: "#2a7a5a", seafoam: "#5a8a78", laurel: "#6a6a2a", thicket: "#4a4a22", ochre: "#b08a2a", pistachio: "#b0c080", taupe: "#8a7a6a", fawn: "#9a7a5a", caramel: "#a07a4a", chocolate: "#4a3020", loam: "#6a5038", sienna: "#7a3e22", chestnut: "#7a5232", tangerine: "#c86a28", blush: "#d09090", rose: "#e0aab8", powder blue: "#a8c0e0", mint: "#a8d0a8", butter: "#e8dc98", apricot: "#e8b888", snow: "#ececec", ivory: "#e8e0c8", ash: "#b0b0b0", chalk: "#b8b4a0", pearl: "#c4c8c4", clay: "#a88878", flint: "#8a8084", graphite: "#505050", storm: "#464650", onyx: "#1e1e1e"}
