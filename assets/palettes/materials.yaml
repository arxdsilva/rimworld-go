# rimworld-go material palette (ART spec §7, §33). Original colours.
# Every lit material resolves to exactly three toon bands:
#   light  - faces turned to the upper-left key light, bevel highlights
#   base   - top faces and neutral planes
#   shadow - faces turned away, cast shadows
# Tintable materials (tint: true) are authored as neutral greys and are
# multiplied by a runtime tint from base.yaml `tints`.
version: 1
materials:
  soil:        {light: "#a08667", base: "#86704f", shadow: "#64543f"}
  soil_rich:   {light: "#76604a", base: "#5c4a37", shadow: "#42362a"}
  gravel:      {light: "#a59d90", base: "#8a8376", shadow: "#6a645a"}
