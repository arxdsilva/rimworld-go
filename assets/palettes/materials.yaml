  # stone (SIM-029/ART-015): rock, smoothed rock, stone walls/floors/fences,
  # stone terrain, chunks and blocks are authored in these near-white
  # neutrals and multiplied at draw time by the cell's stone tint
  # (base.yaml tints.stone_tint) - no mask. Ore sprites put their rock body
  # in stone_tint (masked) so the flecks keep their own colour.
  stone_neutral:      {light: "#f0f0f0", base: "#e6e6e6", shadow: "#b7b7b7"}
  stone_neutral_dark: {light: "#c9c9c9", base: "#bdbdbd", shadow: "#949494"}
  silver:      {light: "#e2e4e6", base: "#cbcfd4", shadow: "#9da0a8"}
  gold:        {light: "#efdb9b", base: "#e2be5d", shadow: "#b08041"}
  # neutral, tinted at runtime
  stone_tint:  {light: "#ffffff", base: "#e6e6e6", shadow: "#ababab", tint: true}
  cloth:       {light: "#f4f4f4", base: "#d2d2d2", shadow: "#a2a2a2", tint: true}
  skin:        {light: "#f6f6f6", base: "#dadada", shadow: "#adadad", tint: true}
  hair:        {light: "#efefef", base: "#c4c4c4", shadow: "#8e8e8e", tint: true}
emissive:
  lamp_warm:   "#ffd98a"
  indicator:   "#7fe3ff"
  gland_ember: "#ffa23c"
  crystal_glow: "#aeeeff"
