# Original rimworld-go UI chrome palette (PLAY-018 cool charcoal).
# Slate panels with blue-grey rules, light text and one restrained
# sea-glass accent; the learning helper keeps a warm brown and gold set.
# Semantic names per ART_DIRECTION §33. These hexes were prototyped for
# this project on captures of the real screens; they are not sampled from
# another game (widgets_test.go keeps every token clear of the reference
# hexes and checks WCAG contrast). Alpha is the last two digits (00–FF).
#
# Consumed by internal/adapters/inbound/ebiten (hardcoded to match).

