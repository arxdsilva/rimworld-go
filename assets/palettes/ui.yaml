# Original rimworld-go UI chrome palette (ART-E neutral charcoal).
# Translucent dark-grey panels, restrained grey rules, warm off-white text
# and one warm gold accent; the learning helper keeps its warm brown and
# gold set. Semantic names per ART_DIRECTION §33. These hexes were picked
# for this project from first principles (CIELAB lightness steps, WCAG
# contrast) and checked on captures of the real screens; they are not
# sampled from another game. widgets_test.go keeps the chrome neutral
# (C* <= 6) and translucent, the text at WCAG 4.5:1, and every token at
# least CIE76 dE 3 from the reference hexes. Alpha is the last two digits
# (00–FF).
#
# Consumed by internal/adapters/inbound/ebiten (hardcoded to match).

