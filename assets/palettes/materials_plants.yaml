# Ground vegetation palette (ART spec 9.1). Flat two-band materials: the
# token is the base band, shadow and light sit one small step either side.
# Merged over materials.yaml by the palette loader (materials_*.yaml).
# palette_mute: applied materials (sat=0.8 contrast=0.8 light=0.96 warm=8)
version: 1
