# Wave E art (DEF-4, PRD-4): the mechanoid raiders' plates, joints and
# wreck oil (families/animals/mech.py), the new goods (families/goods.py)
# and their lens and muzzle lights. Original colours. Merged over
# materials.yaml by the palette loader (materials_*.yaml).
# palette_mute: applied materials (sat=0.8 contrast=0.8 light=0.96 warm=8)
version: 1
