# Builds the game for Linux, Windows and macOS when a version tag is pushed
# (git tag v0.1.0 && git push origin v0.1.0) and publishes a GitHub release
# through GoReleaser (.goreleaser.yaml). Each OS gets its installers (the
# main downloads: a macOS .dmg, a Windows setup .exe, a Linux AppImage,
# .deb and .rpm) and its portable archive (scripts/package_release.sh),
# and every installer is smoke-tested on its own OS before anything is
# published. A manual run (workflow_dispatch) builds and tests the same
# files under a dev version and publishes nothing.
#
# Signing switches on by itself when its secrets exist; without them the
# builds are unsigned (the release notes say how to open them):
#   macOS: APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD, APPLE_TEAM_ID,
#          APPLE_ID, APPLE_APP_PASSWORD (Developer ID, then notarization)
#   Windows: WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD (signtool)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  LINUX_DEPS: >-
    libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev
    libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config
  # A tag names and versions every file; a manual run gets a dev version.
  TAG: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && github.ref_name || format('v0.0.0-dev.{0}', github.run_number) }}
  GO_WINRES: github.com/tc-hib/go-winres@v0.3.3

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          # shellcheck disable=SC2086 # LINUX_DEPS is a word list
          sudo apt-get update && sudo apt-get install -y $LINUX_DEPS xvfb
      - run: go vet ./...
      # -p 2: on 4 vCPUs the two big binaries otherwise starve each other towards
      # the per-binary timeout (.agents/handoffs/OPS.md#ci-001-race-budget-and-memory).
      - run: scripts/ci_test.sh

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: the glibc the binary links against is the oldest a player can run.
          - target: linux-amd64
            os: ubuntu-22.04
          - target: windows-amd64
            os: windows-latest
          - target: macos-universal
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_CERT_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      # keep LF endings: Git Bash runs the packaging scripts on Windows too
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Name the build
        run: |
          {
            echo "NAME=rimworld-go-$TAG-${{ matrix.target }}"
            echo "LDFLAGS=-s -w -X rimworld-go/internal/platform/buildinfo.Version=$TAG"
          } >> "$GITHUB_ENV"
          for f in packaging/icons/rimworld-go.icns packaging/icons/rimworld-go.ico \
            packaging/icons/rimworld-go-{48,128,256,512}.png; do
            [ -f "$f" ] || { echo "::error::$f is missing (make app-icon)"; exit 1; }
          done

      # ---- Linux: cgo against X11, GL and ALSA
      - name: Build (linux)
        if: matrix.target == 'linux-amd64'
        run: |
          # shellcheck disable=SC2086 # LINUX_DEPS is a word list
          sudo apt-get update && sudo apt-get install -y $LINUX_DEPS rpm
          CGO_ENABLED=1 go build -trimpath -ldflags "$LDFLAGS" -o out/rimworld-go ./cmd/game
          scripts/package_release.sh out/rimworld-go "$NAME" tar.gz
      - name: Installers (linux)
        if: matrix.target == 'linux-amd64'
        run: scripts/package_linux.sh out/rimworld-go "$TAG"
      - name: Smoke test (linux)
        if: matrix.target == 'linux-amd64'
        run: scripts/package_linux.sh smoke "$TAG"

      # ---- Windows: no cgo; windowsgui hides the console; go-winres adds
      # the icon and version resource (cmd/game/rsrc_windows_amd64.syso,
      # gitignored).
      - name: Build (windows)
        if: matrix.target == 'windows-amd64'
        run: |
          num=${TAG#v}
          num=${num%%[-+]*}
          [[ $num =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || num=0.0.0
          go run "$GO_WINRES" simply --arch amd64 --out cmd/game/rsrc --manifest gui \
            --icon packaging/icons/rimworld-go.ico --product-name rimworld-go \
            --file-description rimworld-go --original-filename rimworld-go.exe \
            --product-version "$TAG" --file-version "$num.0" --copyright "rimworld-go contributors"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS -H=windowsgui" -o out/rimworld-go.exe ./cmd/game
          rm cmd/game/rsrc_windows_amd64.syso
          scripts/package_release.sh out/rimworld-go.exe "$NAME" zip
          scripts/package_release.sh out/rimworld-go.exe "rimworld-go-$TAG-windows-stage" dir
      - name: Installer (windows)
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          ./scripts/package_windows.ps1 -Tag $env:TAG -Stage "dist/rimworld-go-$env:TAG-windows-stage"
          Remove-Item -Recurse -Force "dist/rimworld-go-$env:TAG-windows-stage"
      - name: Smoke test (windows)
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: ./scripts/package_windows.ps1 -Tag $env:TAG -Smoke "dist/rimworld-go-$env:TAG-windows-setup.exe"

      # ---- macOS: cgo; both architectures joined into one binary
      - name: Import the signing certificate (macos, only with the Apple secrets)
        if: matrix.target == 'macos-universal' && env.HAS_APPLE_CERT == 'true'
        env:
          P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          kc=$RUNNER_TEMP/signing.keychain-db
          kcpass=$(uuidgen)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          # shellcheck disable=SC2046 # the existing keychains are a word list
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -v -p codesigning "$kc" | grep "Developer ID Application" | grep "($TEAM_ID)" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          [ -n "$id" ] || { echo "::error::no Developer ID Application identity for team $TEAM_ID"; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
      - name: Build (macos)
        if: matrix.target == 'macos-universal'
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0" # Go 1.27's floor; Info.plist says the same
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOOS=darwin GOARCH=$arch \
              go build -trimpath -ldflags "$LDFLAGS" -o out/rimworld-go-$arch ./cmd/game
          done
          lipo -create -output out/rimworld-go out/rimworld-go-arm64 out/rimworld-go-amd64
          lipo -info out/rimworld-go
          scripts/package_release.sh out/rimworld-go "$NAME" tar.gz
      - name: Installer (macos)
        if: matrix.target == 'macos-universal'
        run: scripts/package_macos.sh out/rimworld-go "$TAG"
      - name: Notarize (macos, only with the Apple secrets)
        if: matrix.target == 'macos-universal' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg=dist/rimworld-go-$TAG-macos.dmg
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg"
      - name: Smoke test (macos)
        if: matrix.target == 'macos-universal'
        run: scripts/package_macos.sh smoke "dist/rimworld-go-$TAG-macos.dmg" "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            dist/*.dmg
            dist/*-windows-setup.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    # only a pushed tag publishes; a manual run stops after the smoke tests
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog walks back to the previous tag
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts # gitignored: GoReleaser refuses a dirty tree
          merge-multiple: true
      - name: Every installer and archive is there
        run: |
          for f in "rimworld-go-$TAG-macos.dmg" "rimworld-go-$TAG-windows-setup.exe" \
            "rimworld-go-$TAG-x86_64.AppImage" "rimworld-go-$TAG-linux-amd64.deb" \
            "rimworld-go-$TAG-linux-x86_64.rpm" "rimworld-go-$TAG-macos-universal.tar.gz" \
            "rimworld-go-$TAG-windows-amd64.zip" "rimworld-go-$TAG-linux-amd64.tar.gz"; do
            [ -f "release-artifacts/$f" ] || { echo "::error::$f is missing"; exit 1; }
          done
          ls -la release-artifacts
      - name: Start the notes at the last published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(scripts/previous_release.sh "$GITHUB_REF_NAME")
          echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"
          scripts/release_details.sh "$GITHUB_REF_NAME" "$prev" > "$RUNNER_TEMP/details.md"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-footer ${{ runner.temp }}/details.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
