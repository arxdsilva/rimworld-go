# Builds the game for Linux, Windows and macOS when a version tag is pushed
# (git tag v0.1.0 && git push origin v0.1.0) and publishes a GitHub release
# with one archive per platform (scripts/package_release.sh).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  LINUX_DEPS: >-
    libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev
    libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          # shellcheck disable=SC2086 # LINUX_DEPS is a word list
          sudo apt-get update && sudo apt-get install -y $LINUX_DEPS xvfb
      - run: go vet ./...
      - run: xvfb-run -a go test -race -timeout 10m ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            archive: tar.gz
          - target: windows-amd64
            os: ubuntu-latest
            archive: zip
          - target: macos-universal
            os: macos-latest
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    env:
      NAME: rimworld-go-${{ github.ref_name }}-${{ matrix.target }}
      LDFLAGS: -s -w -X main.version=${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build (linux)
        if: matrix.target == 'linux-amd64'
        run: |
          # shellcheck disable=SC2086 # LINUX_DEPS is a word list
          sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
          CGO_ENABLED=1 go build -trimpath -ldflags "$LDFLAGS" -o out/rimworld-go ./cmd/game

      # Ebitengine needs no cgo on Windows; windowsgui hides the console.
      - name: Build (windows)
        if: matrix.target == 'windows-amd64'
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS -H=windowsgui" -o out/rimworld-go.exe ./cmd/game

      # macOS needs cgo; build both architectures and join them.
      - name: Build (macos)
        if: matrix.target == 'macos-universal'
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOOS=darwin GOARCH=$arch \
              go build -trimpath -ldflags "$LDFLAGS" -o out/rimworld-go-$arch ./cmd/game
          done
          lipo -create -output out/rimworld-go out/rimworld-go-arm64 out/rimworld-go-amd64
          lipo -info out/rimworld-go

      - name: Package
        run: |
          bin=out/rimworld-go
          [ -f out/rimworld-go.exe ] && bin=out/rimworld-go.exe
          scripts/package_release.sh "$bin" "$NAME" "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Unpack the archive for your system and run `rimworld-go` (`rimworld-go.exe` on Windows); keep the `assets` folder next to it.

          - **macOS:** the build is unsigned. The first time, right-click `rimworld-go` → Open, or run `xattr -dr com.apple.quarantine <folder>`.
          - **Windows:** SmartScreen may warn about an unknown publisher → More info → Run anyway.
          - **Linux:** needs OpenGL and ALSA (most desktops have them).
          EOF
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "rimworld-go $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes $prerelease
