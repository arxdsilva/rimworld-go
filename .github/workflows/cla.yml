name: cla

# Every pull request's author signs CLA.md once (by commenting the sign
# line); until they do, this check fails. Make "cla" a required status
# check on main (Settings > Branches) so an unsigned pull request cannot
# be merged. Signatures are kept on the cla-signatures branch.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        # pinned by commit (v2.6.1): it runs with write access on pull_request_target
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/arxdsilva/rimworld-go/blob/main/CLA.md
          branch: cla-signatures
          allowlist: arxdsilva,dependabot[bot]
